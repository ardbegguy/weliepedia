<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="512" fill="#E6E6E6"/>

  <!-- Neumorphic outer ring shadow simulation -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="12"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(196,196,196,0.6)" stroke-width="4" stroke-dasharray="0 0" transform="rotate(180 256 256)"/>

  <!-- Orange filled center disc -->
  <circle cx="256" cy="256" r="200" fill="#FF6A39"/>

  <!-- Glare overlay on disc -->
  <ellipse cx="230" cy="190" rx="110" ry="60" fill="rgba(255,255,255,0.18)" transform="rotate(-20 230 190)"/>

  <!-- Lightning bolt (GENERATE LIE icon) -->
  <path
    d="M285 110 L190 270 H248 L227 402 L322 242 H264 L285 110Z"
    fill="white"
    opacity="0.95"
  />

  <!-- Small "ALBI" wordmark below bolt -->
  <text
    x="256"
    y="440"
    text-anchor="middle"
    font-family="'Space Mono', monospace"
    font-size="38"
    font-weight="700"
    letter-spacing="12"
    fill="#262626"
    opacity="0.55"
  >ALBI</text>
</svg>
